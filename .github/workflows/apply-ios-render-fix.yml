name: Apply iOS render fix

on:
  push:
    branches:
      - fix/ios-render-loop

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-render-loop

      - name: Patch renderer scheduler
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          replacements = [
              (
                  "  let lastRenderAt = -Infinity;",
                  "  let nextRenderAt = 0;"
              ),
              (
                  "    if (now - lastRenderAt >= RENDER_INTERVAL) {",
                  "    if (now >= nextRenderAt) {"
              ),
              (
                  "      lastRenderAt = now - ((now - lastRenderAt) % RENDER_INTERVAL);\n",
                  ""
              ),
              (
                  "      renderFrame++;\n    }\n  }\n\n  function resizeRenderer()",
                  "      renderFrame++;\n      nextRenderAt = now + RENDER_INTERVAL;\n    }\n  }\n\n  function resizeRenderer()"
              ),
              (
                  "    lastRenderAt = -Infinity;",
                  "    nextRenderAt = 0;"
              ),
              (
                  "  window.visualViewport?.addEventListener('resize', () => requestAnimationFrame(resizeRenderer));",
                  """  window.addEventListener('pageshow', () => {
    lastPhysicsAt = performance.now();
    nextRenderAt = 0;
    resizeRenderer();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      lastPhysicsAt = performance.now();
      nextRenderAt = 0;
    }
  });"""
              ),
          ]

          for old, new in replacements:
              assert old in s, f'missing expected block: {old[:60]!r}'
              s = s.replace(old, new, 1)

          assert 'lastRenderAt' not in s
          assert 'nextRenderAt = now + RENDER_INTERVAL;' in s
          path.write_text(s)
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-ios-render-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-ios-render-fix.yml
          git commit -m "Fix iOS 12fps render scheduler [skip ci]"
          git push origin HEAD:fix/ios-render-loop
