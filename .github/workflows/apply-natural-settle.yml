name: Apply natural settle fix

on:
  push:
    branches:
      - fix/ios-render-loop

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-render-loop

      - name: Patch natural settle behavior
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-natural-settle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-natural-settle.yml
          git commit -m "Prefer physical top face when dice settles [skip ci]"
          git push origin HEAD:fix/ios-render-loop
