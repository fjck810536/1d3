name: Apply iOS render fix

on:
  push:
    branches:
      - fix/ios-render-loop

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-render-loop

      - name: Patch renderer scheduler
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          old = "  let lastRenderAt = -Infinity;"
          assert old in s
          s = s.replace(old, "  let nextRenderAt = 0;", 1)

          old = "    if (now - lastRenderAt >= RENDER_INTERVAL) {"
          assert old in s
          s = s.replace(old, "    if (now >= nextRenderAt) {", 1)

          old = "      lastRenderAt = now - ((now - lastRenderAt) % RENDER_INTERVAL);\n"
          assert old in s
          s = s.replace(old, "", 1)

          old = "      renderFrame++;\n    }\n  }\n\n  function resizeRenderer()"
          assert old in s
          s = s.replace(old, "      renderFrame++;\n      nextRenderAt = now + RENDER_INTERVAL;\n    }\n  }\n\n  function resizeRenderer()", 1)

          old = "    lastRenderAt = -Infinity;"
          assert old in s
          s = s.replace(old, "    nextRenderAt = 0;", 1)

          assert 'lastRenderAt' not in s
          path.write_text(s)

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-ios-render-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-ios-render-fix.yml
          git commit -m "Fix iOS 12fps render scheduler [skip ci]"
          git push origin HEAD:fix/ios-render-loop
